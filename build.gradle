plugins {
	// see https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml for new versions
	id 'net.fabricmc.fabric-loom' version '1.18.4' apply false
	// see https://projects.neoforged.net/neoforged/moddevgradle for new versions
	id 'net.neoforged.moddev' version '2.0.148' apply false
}

// Java, Node and Python versions are set once, in .tool-versions; the dev image installs exactly these (docker/).
// Java is the version the mod is compiled for and requires (toolchain, release flag, mod metadata).
def javaLine = file('.tool-versions').readLines().find { it.trim().startsWith('java ') }
if (javaLine == null) {
	throw new GradleException('.tool-versions has no "java <version>" line')
}
allprojects {
	ext.java_version = javaLine.trim().split(/\s+/)[1]
}

// The web UI is built once here and packed into both loader JARs (see multiloader-loader.gradle).

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('yarnInstall', Exec) {
	workingDir file('web')
	if (isWindows) {
		commandLine 'cmd', '/c', 'corepack', 'yarn', 'install'
	} else {
		commandLine 'corepack', 'yarn', 'install'
	}
	inputs.files file('web/package.json'), file('web/yarn.lock')
	outputs.dir file('web/node_modules')
}

tasks.register('extractMcTextures', Exec) {
	def version = project.minecraft_version as String
	// ./gradlew build -PrefreshTextures deletes this version's cached downloads (scripts/.cache) and fetches them again.
	def refresh = providers.gradleProperty('refreshTextures').isPresent()
	inputs.property 'minecraft_version', version
	inputs.file file('scripts/textures/extract_mc_textures.py')
	outputs.dir file('web/static/mc')
	outputs.file file('web/src/lib/mc/icons.json')
	outputs.file file('web/src/lib/mc/advancementLang.json')
	if (refresh) {
		outputs.upToDateWhen { false }
	}
	def script = ['scripts/textures/extract_mc_textures.py', '--version', version] + (refresh ? ['--refresh'] : [])
	if (isWindows) {
		commandLine(['cmd', '/c', 'python'] + script)
	} else {
		commandLine(['python3'] + script)
	}
}

tasks.register('yarnBuild', Exec) {
	dependsOn yarnInstall, extractMcTextures
	workingDir file('web')
	if (isWindows) {
		commandLine 'cmd', '/c', 'corepack', 'yarn', 'build'
	} else {
		commandLine 'corepack', 'yarn', 'build'
	}
	inputs.dir file('web/src')
	inputs.dir file('web/static')
	inputs.files file('web/package.json'), file('web/yarn.lock'), file('web/vite.config.ts'), file('web/tsconfig.json'), file('web/src/app.html')
	outputs.dir file('web/build')
}
