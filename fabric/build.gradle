plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = "${archives_base_name}-fabric"
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
	runs {
		client {
			client()
			setConfigName('Fabric Client')
			ideConfigGenerated(true)
			runDir('runs/client')
		}
		server {
			server()
			setConfigName('Fabric Server')
			ideConfigGenerated(true)
			runDir('runs/server')
		}
	}
}

// Game tests with a mock player on a real server: ./gradlew :fabric:runGameTest. The tests themselves are shared with
// NeoForge (common/src/gametest); src/gametest only registers them. Not part of the mod JAR.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "${mod_id}_gametest"
		enableGameTests = true
		enableClientGameTests = false
		eula = true
	}
}

sourceSets {
	gametest {
		java.srcDir(rootProject.file('common/src/gametest/java'))
	}
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'fabric')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'fabric')
			}
		}
	}
}
