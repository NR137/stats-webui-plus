# Placeholders are filled in by processResources (build-logic/src/main/groovy/multiloader-common.gradle).
license="${license}"
issueTrackerURL="${mod_homepage}/issues"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
iconFile="assets/${mod_id}/icon.png"
authors="NR137, borrageiros (original author of mc-stats-webui)"
credits="Based on mc-stats-webui by borrageiros: ${original_homepage}"
displayURL="${mod_homepage}"
description='''
Live player statistics website and JSON API for NeoForge servers. A fork of mc-stats-webui by borrageiros.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
