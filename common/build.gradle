// Loader-independent code. Compiled against plain Minecraft (NeoForm) so it can't use Fabric or NeoForge APIs;
// the loader projects compile these sources again into their own JARs.
plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

neoForge {
	neoFormVersion = neo_form_version
	// Puts Minecraft on the test classpath too, for the classes that touch its types.
	addModdingDependenciesTo(sourceSets.test)
}

dependencies {
	// Fabric and NeoForge both bundle this Mixin library, so it is only needed to compile.
	// Keep it in line with what NeoForge and Fabric Loader ship.
	compileOnly('net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7')

	testImplementation(platform('org.junit:junit-bom:5.13.4'))
	testImplementation('org.junit.jupiter:junit-jupiter')
	testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

// Unit and HTTP tests for the loader-independent code: ./gradlew :common:test
tasks.named('test', Test) {
	useJUnitPlatform()
	// Minecraft's logging writes logs/ into the working folder; keep it out of the source tree.
	def runDir = layout.buildDirectory.dir('test-run')
	workingDir = runDir.get().asFile
	doFirst { runDir.get().asFile.mkdirs() }
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}
