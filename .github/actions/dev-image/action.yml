name: dev image
description: >-
  Builds the dev image (docker/Dockerfile) with the runner's user IDs and restores the Gradle and Yarn caches, so the
  next steps can run `docker compose run --rm -T dev ./tasks.sh <task>` like on a developer's machine.

runs:
  using: composite
  steps:
    # compose.yaml reads these: the container user gets the runner's IDs, and the caches are folders this job caches.
    - name: environment for compose
      shell: bash
      run: |
        echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
        echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"
        echo "GRADLE_CACHE=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"
        echo "YARN_CACHE=$RUNNER_TEMP/yarn-cache" >> "$GITHUB_ENV"
        # The image is built below with the Actions layer cache; compose must not build it again.
        echo "DEV_IMAGE_POLICY=never" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/gradle-home" "$RUNNER_TEMP/yarn-cache"

    # Gradle's downloads and Minecraft's decompiled sources (NeoForm), which take a few minutes to make.
    - name: cache gradle
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/gradle-home/caches
          ${{ runner.temp }}/gradle-home/wrapper
        key: gradle-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties', '.tool-versions') }}
        restore-keys: gradle-

    - name: cache yarn packages
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/yarn-cache
        key: yarn-${{ hashFiles('web/yarn.lock') }}
        restore-keys: yarn-

    - name: setup buildx
      uses: docker/setup-buildx-action@v3

    # Layers come from the GitHub Actions cache unless docker/Dockerfile, .tool-versions or the requirements changed.
    - name: build dev image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        load: true
        tags: stats-webui-plus-dev
        build-args: |
          USER_UID=${{ env.USER_UID }}
          USER_GID=${{ env.USER_GID }}
        cache-from: type=gha,scope=dev-image-${{ runner.arch }}
        cache-to: type=gha,scope=dev-image-${{ runner.arch }},mode=max
