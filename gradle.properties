# Loom and ModDevGradle in one build need more memory than either alone.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Every property used in fabric.mod.json / neoforge.mods.toml must be listed in
# build-logic/src/main/groovy/multiloader-common.gradle (expandProps).

# Project
mod_version=1.3.0
group=webui.stats.mc
# java_version comes from .tool-versions (see build.gradle)
archives_base_name=stats-webui-plus

# Common
minecraft_version=26.3
minecraft_version_range=[26.3]
# mod_id must match [a-z][a-z0-9_]{1,63} and McStatsWebui.MOD_ID
mod_id=stats_webui_plus
mod_name=Stats WebUI Plus
license=MIT
# Shown in the mod metadata; change these when the repository is renamed.
mod_homepage=https://github.com/NR137/stats-webui-plus
original_homepage=https://github.com/borrageiros/mc-stats-webui
# Plain Minecraft that common/ compiles against, see https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, check these on https://fabricmc.net/develop
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# NeoForge, check these on https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.3.0.97
